<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Base — Electric Air Shipping</title>
    <meta name="description"
        content="The Electric Air Shipping knowledge base: the pitch deck, the interactive fleet calculator, the Vision whitepaper, the Shape-Volume Scalar paper, and the full Sunship conceptual design.">
    <link rel="shortcut icon" href="../assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../assets/site.css">
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --pad: 1rem;
            --border: 0.25rem;
            --circlesize: 4rem;
            --FULL_LENGTH: 240;
            --SEG_LENGTH: 40;
            --pink: var(--berry);
            --gray: #777;
        }

        html,
        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--fg);
            height: 100%;
            font-family: Genos;
            max-height: 2000px;
        }

        /* The fixed top bar sits above this grid. Padding rather than a grid
           row so the hexagon's proportions are untouched; box-sizing keeps it
           inside the 100% height. */
        /* The text row is minmax'd, not fr'd: an fr row grows as the heading
           wraps to two or three lines, which visibly resizes the hexagon
           every time a vertex with longer copy is tapped. Reserving three
           lines' worth up front keeps the hexagon still. */
        body {
            padding-top: var(--bar-h);
            display: grid;
            /* minmax(0, 1fr) on the hex row: without the 0, grid uses the
               row contents' natural size as a floor, the row inflates past
               its share, and the whole page gains a slight scroll. */
            grid-template-rows: var(--pad) minmax(10rem, auto) var(--pad) minmax(0, 1fr) var(--pad);
            grid-template-columns: var(--pad) 1fr var(--pad);
            grid-template-areas:
                ".... .... ...."
                ".... text ...."
                ".... .... ...."
                ".... main ...."
                ".... .... ....";
        }

        .text-container-container {
            grid-area: text;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .text-container {
            display: flex;
        }

        .text-spacer-left {
            width: 2rem;
            flex-shrink: 0;
        }

        .text-spacer-right {
            width: 2rem;
            flex-shrink: 0;
        }

        .text-text {
            flex-grow: 1;
            border: 0.25rem solid #222;
            border-radius: 0.25rem;
            position: relative;
            display: flex;
            justify-content: center;
        }

        .text-number {
            position: absolute;
            border: var(--border) solid #222;
            border-radius: 50%;
            width: 4rem;
            height: 4rem;
            left: calc((var(--circlesize) + var(--border))/-2);
            bottom: calc(50% - 2rem);
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .text-number>span {
            font-size: 3rem;
            color: var(--pink);
            transform: translateY(-0.2rem);
        }

        .text {
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        .text .subtitle {
            font-size: 1.5rem;
        }

        .hyperlink {
            color: var(--pink);
        }

        .hyperlink:hover {
            color: var(--orange);
        }

        .hex {
            grid-area: main;
            justify-self: center;
            align-self: center;
        }

        .bg-img {
            grid-area: main;
            display: block;
            max-width: 100%;
            max-height: 80%;
            justify-self: center;
            align-self: center;
        }

        p,
        h1 {
            margin: 0;
        }

        @media (min-width: 800px) {
            body {
                grid-template-rows: var(--pad) 2fr var(--pad) minmax(0, 10fr) calc(var(--pad)*2);
                grid-template-columns: var(--pad) 1fr 3fr 1fr var(--pad);
                grid-template-areas:
                    ".... .... .... .... ...."
                    ".... .... text .... ...."
                    ".... .... .... .... ...."
                    ".... main main main ...."
                    ".... .... .... .... ....";
            }
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .path-animate {
            transition: stroke-dashoffset 1s ease-out;
            stroke-dasharray: var(--FULL_LENGTH);
            stroke-dashoffset: 240;
            fill: none;
            stroke: var(--pink);
            stroke-width: 0.5px;
        }

        .path-bg {
            stroke: var(--gray);
            stroke-width: 0.5px;
            fill: none;
        }

        .path0 { stroke-dashoffset: 240; }
        .path1 { stroke-dashoffset: 200; }
        .path2 { stroke-dashoffset: 160; }
        .path3 { stroke-dashoffset: 120; }
        .path4 { stroke-dashoffset: 80; }
        .path5 { stroke-dashoffset: 0; }

        .circle-select {
            transition: stroke 1s;
            transition: r 1s;
            fill: var(--bg);
            stroke: var(--gray);
            stroke-width: 0.5px;
            r: 7.5px;
        }

        .circle-select:hover {
            cursor: pointer;
        }

        .circle-select.selected {
            transition: stroke 3s;
            r: 8px;
            stroke: var(--pink);
        }

        .selected-text {
            fill: var(--pink)
        }

        svg>text {
            transition: fill 1s;
            pointer-events: none;
            fill: var(--gray);
            font-size: 10px;
            font-family: Genos;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .video-portal {
            fill: none;
            stroke: orange;
            stroke-width: 0.25px;
        }

        /* The spinning shapes: an alpha webm <video> for most browsers, which
           WebKit swaps for an animated WebP <img> (see the script by the
           element) — WebKit plays alpha webm without its transparency, and
           the WebP carries the same transparency, so BOTH render clean.
           (Earlier keep-inside-the-circle sizing gymnastics existed for a
           black video background that no longer reaches any browser.)
           Original sizing: content square = half the cell's smaller side,
           sitting comfortably in the portal circle at 55%. */
        .hex-anim {
            display: block;
            width: 50%;
            height: 50%;
            min-width: 0;
            min-height: 0;
            object-fit: contain;
        }

        /* Phone: the hexagon runs edge to edge, the heading drops a size so
           it wraps less, and the vertex circles grow into honest tap targets
           (r is a presentation property — settable from CSS on SVG2). */
        @media (max-width: 700px) {
            .text .title {
                font-size: 1.6rem;
            }

            svg.hex {
                width: 100vw;
                max-width: 100vw;
            }

            /* (Animation sizing is universal now — see .hex-anim above.) */
        }

        @media (pointer: coarse) {
            .circle-select {
                r: 10px;
            }

            .circle-select.selected {
                r: 10.5px;
            }

            svg>text {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <header class="topbar">
        <a class="topbar-home" href="/" aria-label="Electric Air Shipping — home">
            <img src="../assets/logo-berry-white.svg" alt="Electric Air Shipping">
        </a>
        <nav class="topbar-nav">
            <a href="mailto:contact@electricairshipping.com" data-track="contact">CONTACT</a>
            <a href="#" data-nl-open data-track="receive">RECEIVE</a>
        </nav>
    </header>

    <img class="bg-img" src="../assets/bg.svg" alt="">
    <div class="text-container-container">
        <div class="text-container">
            <div class="text-spacer-left"></div>
            <div class="text-text">
                <div class="text-number">
                    <span data-id="text-number">1</span>
                </div>
                <div class="text-spacer-right"></div>
                <div class="text">
                    <h1 data-id="title" class="title">Welcome to the Electric Air Shipping project!</h1>
                    <p data-id="subtitle" class="subtitle">Please explore our knowledge base.</p>
                </div>
            </div>
        </div>
    </div>

    <video src="../assets/render.webm" autoplay loop muted playsinline class="hex hex-anim"></video>
    <script>
        /* WebKit plays the alpha webm WITHOUT transparency — a black box —
           and on iOS EVERY browser is WebKit underneath, Chrome and Firefox
           included. All of them render animated WebP alpha correctly, so
           iOS devices and desktop Safari get the WebP (heavier at 4.9MB, but
           the only version that looks right there). Everything else keeps
           the 2MB webm at its native smoothness. A false positive only costs
           the extra MB. iPads reporting as Mac land on the Safari branch. */
        if (/iPhone|iPad|iPod/.test(navigator.userAgent)
            || /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent)) {
            const v = document.querySelector('.hex-anim');
            const img = document.createElement('img');
            img.src = '../assets/render-anim.webp';
            img.alt = '';
            img.className = v.className;
            v.replaceWith(img);
        }
    </script>
    <svg viewBox="0 0 100 100" class="hex" aria-label="Six-point knowledge base navigation">
        <path class="path-bg" d="M30 15.359 H70 L90 50 L70 84.641 H30 L10 50 Z"></path>
        <path class="path-animate" d="M30 15.359 H70 L90 50 L70 84.641 H30 L10 50 Z"></path>
        <circle class="circle-select selected" data-circle="0" cx="30" cy="15.359"></circle>
        <circle class="circle-select" data-circle="1" cx="70" cy="15.359"></circle>
        <circle class="circle-select" data-circle="2" cx="90" cy="50"></circle>
        <circle class="circle-select" data-circle="3" cx="70" cy="84.641"></circle>
        <circle class="circle-select" data-circle="4" cx="30" cy="84.641"></circle>
        <circle class="circle-select" data-circle="5" cx="10" cy="50"></circle>
        <text class="selected-text" data-text="0" x="30" y="15.359">1</text>
        <text data-text="1" x="70" y="15.359">2</text>
        <text data-text="2" x="90" y="50">3</text>
        <text data-text="3" x="70" y="84.641">4</text>
        <text data-text="4" x="30" y="84.641">5</text>
        <text data-text="5" x="10" y="50">6</text>
        <circle class="video-portal" cx="50" cy="50" r="27.5"></circle>
    </svg>

    <!-- Hex 6 access gate. Shares the newsletter modal's styles (.nl-*).
         The gate is marketing theatre by design — the real payoff is the
         ASK NICELY funnel; every request becomes a verified address. -->
    <div class="nl-overlay" data-gate-overlay role="dialog" aria-modal="true" aria-label="Access required">
        <div class="nl-box">
            <div>Access required</div>
            <div data-gate-step1>
                <label class="visually-hidden" for="gate-pw">Access code</label>
                <input id="gate-pw" type="password" placeholder="access code" data-gate-pw
                    style="width:100%" autocomplete="off">
            </div>
            <div data-gate-step2 style="display:none">
                <label class="visually-hidden" for="gate-email">Your email address</label>
                <input id="gate-email" type="email" placeholder="your@email.com" data-gate-email
                    style="width:100%">
                <label style="display:flex;gap:0.5em;align-items:center;font-size:0.95rem;color:#eaeaea;margin-top:0.75rem">
                    <input type="checkbox" data-gate-consent>
                    also send me the EAS newsletter
                </label>
                <div data-gate-turnstile style="margin-top:0.75rem"></div>
            </div>
            <div class="nl-msg" data-gate-msg role="status" aria-live="polite"></div>
            <div class="nl-actions">
                <a data-gate-cancel tabindex="0" role="button">CANCEL</a>
                <a data-gate-ask tabindex="0" role="button">ASK NICELY</a>
                <a data-gate-ok tabindex="0" role="button">OK</a>
            </div>
        </div>
    </div>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <script src="../assets/newsletter.js" defer></script>
    <script src="../assets/analytics.js" defer></script>
    <script>
        /* The six knowledge base slots.
         *
         * These values used to be fetched live from a Google Sheet that
         * overrode whatever was in this file. That existed from when the site
         * was hosted by someone else and copy changes had to bypass a deploy.
         * It is no longer needed, so the sheet's live values were captured here
         * on 2026-08-11 and the fetch removed — along with a third-party
         * request in the boot path of every page load.
         *
         * Note the whitepaper, maths paper and conceptual design have NO page
         * counts. That was a deliberate edit; do not "restore" them.
         */
        const config = [
            {
                title: "Welcome to the Electric Air Shipping project!",
                subtitle: "Please explore our knowledge base."
            },
            {
                title: "Click here to:-",
                subtitle: "See the <a target='_blank' rel='noopener' class='hyperlink' href='https://drive.google.com/file/d/1j3zN5wPRL4vD6RBr7XTnyx6hq1u_tfNi/view'>EAS overview (Pitchdeck)</a>"
            },
            {
                title: "Play with the:",
                subtitle: "<a target='_blank' rel='noopener' class='hyperlink' href='https://calc.electricairshipping.com'>Interactive EAS Fleet Calculator</a>"
            },
            {
                title: "Read the:",
                subtitle: "<a target='_blank' rel='noopener' class='hyperlink' href='https://drive.google.com/file/d/1ARGSUN5e6wHadcO3wT6FCcmrhRsPxvbI/view'>Vision//Whitepaper</a>"
            },
            {
                title: "Read the:",
                subtitle: "<a target='_blank' rel='noopener' class='hyperlink' href='https://drive.google.com/file/d/1_xdBSdVZ-B19MCYf1XynxpSxqAu0TEsW/view'>Maths &amp; Design paper</a>"
            },
            {
                title: "View the full:",
                // Slot 6 is gated. The document URL is deliberately NOT in
                // this file — the server returns it only to a correct
                // password (see /api/gate), and an unlocked device keeps it
                // in localStorage. View-source reveals nothing.
                subtitle: null,
            },
        ];

        const DOC_KEY = 'eas_doc_url';
        function slot6Subtitle() {
            const url = localStorage.getItem(DOC_KEY);
            return url
                ? `<a target='_blank' rel='noopener' class='hyperlink' href='${url}'>Sunship Conceptual Design</a>`
                : "<a class='hyperlink' href='#' data-gate-open>Sunship Conceptual Design</a>";
        }

        const elements = {
            path: document.querySelector(".path-animate"),
            circles: document.querySelectorAll("[data-circle]"),
            texts: document.querySelectorAll("[data-text]"),
            title: document.querySelector('[data-id="title"]'),
            subtitle: document.querySelector('[data-id="subtitle"]'),
            currentNumber: document.querySelector('[data-id="text-number"]'),
        };

        function updateSelection(progressNumber) {
            const n = Number(progressNumber);

            for (let i = 0; i <= 5; i++) elements.path.classList.remove(`path${i}`);
            elements.path.classList.add(`path${n}`);

            for (const [i, text] of elements.texts.entries())
                text.classList.toggle("selected-text", i <= n);

            for (const [i, circle] of elements.circles.entries())
                circle.classList.toggle("selected", i <= n);

            elements.title.textContent = config[n].title;
            elements.subtitle.innerHTML = n === 5 ? slot6Subtitle() : config[n].subtitle;
            elements.currentNumber.textContent = n + 1;
        }

        updateSelection(0);

        for (const circle of elements.circles) {
            circle.addEventListener("click", () => updateSelection(circle.dataset.circle));
        }

        /* ------------------------------- the hex 6 access gate ------------ */
        (() => {
            // Same site-wide key the newsletter uses; registered to the domain.
            const TURNSTILE_SITEKEY = '0x4AAAAAAEKubehZQp3K3TbK';

            const overlay = document.querySelector('[data-gate-overlay]');
            const step1 = document.querySelector('[data-gate-step1]');
            const step2 = document.querySelector('[data-gate-step2]');
            const pwIn = document.querySelector('[data-gate-pw]');
            const emailIn = document.querySelector('[data-gate-email]');
            const consent = document.querySelector('[data-gate-consent]');
            const msg = document.querySelector('[data-gate-msg]');
            const askBtn = document.querySelector('[data-gate-ask]');
            const okBtn = document.querySelector('[data-gate-ok]');
            let busy = false;
            let tsWidget = null;

            const setStep = (n) => {
                step1.style.display = n === 1 ? '' : 'none';
                step2.style.display = n === 2 ? '' : 'none';
                askBtn.style.display = n === 1 ? '' : 'none';
                okBtn.textContent = n === 1 ? 'OK' : 'SEND';
                msg.textContent = '';
                (n === 1 ? pwIn : emailIn).focus();
            };

            const open = () => {
                overlay.classList.add('open');
                setStep(1);
            };
            const close = () => {
                if (busy) return;
                overlay.classList.remove('open');
            };

            // The slot-6 link is re-rendered on every selection, so listen on
            // the container, not the link.
            elements.subtitle.addEventListener('click', (e) => {
                const a = e.target.closest('[data-gate-open]');
                if (a) { e.preventDefault(); open(); }
            });

            document.querySelector('[data-gate-cancel]').addEventListener('click', close);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
            pwIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') okBtn.click(); });
            emailIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') okBtn.click(); });

            askBtn.addEventListener('click', () => {
                setStep(2);
                if (tsWidget === null && window.turnstile) {
                    tsWidget = window.turnstile.render(document.querySelector('[data-gate-turnstile]'), {
                        sitekey: TURNSTILE_SITEKEY,
                        theme: 'dark',
                    });
                }
            });

            const submitPassword = async () => {
                busy = true;
                msg.textContent = '…';
                try {
                    const res = await fetch('/api/gate', {
                        method: 'POST',
                        headers: { 'content-type': 'application/json' },
                        body: JSON.stringify({ password: pwIn.value }),
                    });
                    const data = await res.json();
                    if (data.ok && data.url) {
                        localStorage.setItem(DOC_KEY, data.url);
                        if (window.easTrack) window.easTrack('gate_unlock');
                        msg.textContent = 'Welcome ✓';
                        updateSelection(5);   // slot 6 becomes a plain link on this device
                        setTimeout(() => { busy = false; close(); window.open(data.url, '_blank', 'noopener'); }, 600);
                        return;
                    }
                    msg.textContent = data.error === 'server'
                        ? 'Something went wrong — please try again later.'
                        : 'Access Denied';
                } catch {
                    msg.textContent = 'Something went wrong — please try again later.';
                }
                busy = false;
            };

            const submitAsk = async () => {
                const email = emailIn.value.trim();
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
                    msg.textContent = 'Please enter a valid email address.';
                    return;
                }
                const tsToken = window.turnstile && tsWidget !== null
                    ? window.turnstile.getResponse(tsWidget) : '';
                // The widget cannot pass on localhost (sitekey is domain-bound);
                // the local mock server ignores the token anyway.
                if (!tsToken && location.hostname !== 'localhost') {
                    msg.textContent = 'Please complete the verification check.';
                    return;
                }
                busy = true;
                msg.textContent = 'Submitting…';
                try {
                    const res = await fetch('/api/waitlist', {
                        method: 'POST',
                        headers: { 'content-type': 'application/json' },
                        body: JSON.stringify({
                            email, tsToken,
                            source: 'design-doc',
                            nlConsent: consent.checked,
                        }),
                    });
                    const data = await res.json();
                    if (data.ok) {
                        if (window.easTrack) window.easTrack('gate_ask');
                        msg.textContent = data.status === 'code-sent'
                            ? 'Code sent — check your email ✓'
                            : 'Check your inbox to confirm ✓';
                        emailIn.value = '';
                        setTimeout(() => { busy = false; close(); }, 2600);
                        return;
                    }
                    msg.textContent = data.error === 'invalid'
                        ? 'Please enter a valid email address.'
                        : data.error === 'turnstile'
                            ? 'Verification failed — please try again.'
                            : data.error === 'email'
                                ? 'Couldn’t send the email — please try again later.'
                                : 'Something went wrong — please try again later.';
                    if (window.turnstile && tsWidget !== null) window.turnstile.reset(tsWidget);
                } catch {
                    msg.textContent = 'Something went wrong — please try again later.';
                }
                busy = false;
            };

            okBtn.addEventListener('click', () => {
                if (busy) return;
                if (step1.style.display !== 'none') submitPassword();
                else submitAsk();
            });
        })();
    </script>
</body>

</html>

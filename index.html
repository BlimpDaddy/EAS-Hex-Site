    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-snap-type: y proximity;
            /* One decisive scroll lands on a slide top; a nudge springs back.
               Snap targets clear the fixed bar because scroll-padding-top and
               the bar's height are the same variable — they cannot drift. */
            scroll-padding-top: var(--bar-h);
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: Geist, system-ui, sans-serif;
        }

        h1,
        h2,
        p {
            margin: 0;
        }

        .snap {
            scroll-snap-align: start;
        }

        /* ------------------------------------------------------------ hero */

        /* svh, not dvh: dvh changes as the mobile URL bar hides and shows,
           which re-lays-out every full-height section MID-SCROLL — the page
           visibly stutters between slides. svh is the stable small size; the
           cost is a sliver of letterbox when the URL bar is collapsed, the
           gain is that nothing moves under the visitor's thumb. */
        .hero {
            position: relative;
            min-height: 100vh;
            min-height: 100svh;
            overflow: hidden;
        }

        .hero-lead,
        .hero-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-size: cover;
            background-position: center;
        }

        /* The lead render is the only image in the initial markup — the other
           four are attached by script AFTER window load so nothing competes
           with the largest contentful paint. Each overlay then takes a slot in
           a 30s cycle; while an overlay is transparent (or not yet loaded) the
           lead shows through, so a slow connection degrades to a still. */
        .hero-layer {
            opacity: 0;
            animation: heroFade 30s linear infinite;
        }

        .hero-layer:nth-of-type(2) { animation-delay: 4.5s; }
        .hero-layer:nth-of-type(3) { animation-delay: 10.5s; }
        .hero-layer:nth-of-type(4) { animation-delay: 16.5s; }
        .hero-layer:nth-of-type(5) { animation-delay: 22.5s; }

        @keyframes heroFade {
            0% { opacity: 0; }
            5% { opacity: 1; }
            20% { opacity: 1; }
            25% { opacity: 0; }
            100% { opacity: 0; }
        }

        /* Scrim: the text sits over five different frames as they cycle, so
           contrast is tuned against the BRIGHTEST (docking), not the lead. */
        .hero-scrim {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top,
                    rgba(8, 8, 8, 0.78) 0%,
                    rgba(8, 8, 8, 0.45) 32%,
                    rgba(8, 8, 8, 0.0) 62%);
        }

        .hero-text {
            position: absolute;
            left: clamp(1.25rem, 6vw, 5rem);
            right: clamp(1.25rem, 6vw, 5rem);
            bottom: clamp(2.5rem, 9vh, 6rem);
            max-width: 46rem;
        }

        .hero-text .lockup {
            height: clamp(2.1rem, 5vh, 3rem);
            width: auto;
            display: block;
            margin-bottom: clamp(1rem, 3vh, 1.75rem);
        }

        .hero-text h1 {
            font-size: clamp(1.9rem, 4.6vw, 3.4rem);
            font-weight: 500;
            line-height: 1.12;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }

        .hero-text .sub {
            margin-top: clamp(0.7rem, 2vh, 1.1rem);
            font-size: clamp(1.05rem, 2vw, 1.45rem);
            font-weight: 400;
            color: var(--orange);
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.9rem;
            margin-top: clamp(1.4rem, 3.5vh, 2.2rem);
        }

        .btn {
            display: inline-block;
            padding: 0.7em 1.5em;
            border-radius: 0.3rem;
            font-family: Genos, system-ui, sans-serif;   /* chrome = Genos */
            font-size: clamp(1.05rem, 1.8vw, 1.25rem);
            font-weight: 500;
            letter-spacing: 0.07em;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--berry);
            color: #fff;
        }

        .btn-primary:hover,
        .btn-primary:focus-visible {
            background: #d63bb4;
        }

        .btn-secondary {
            background: rgba(17, 17, 17, 0.55);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(6px);
        }

        .btn-secondary:hover,
        .btn-secondary:focus-visible {
            border-color: #fff;
            background: rgba(17, 17, 17, 0.75);
        }

        .btn:focus-visible {
            outline: 2px solid var(--orange);
            outline-offset: 3px;
        }

        .chev {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 0.9rem;
            color: rgba(255, 255, 255, 0.85);
            animation: chevNudge 2.4s ease-in-out infinite;
        }

        .chev svg {
            width: 1.9rem;
            height: 1.9rem;
            display: block;
        }

        @keyframes chevNudge {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, 0.45rem); }
        }

        /* ------------------------------------------------------------ deck */

        .deck {
            position: relative;
        }

        .slide {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: var(--bar-h);
        }

        .slide figure {
            margin: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide img {
            display: block;
            max-width: 100%;
            max-height: calc(100vh - var(--bar-h));
            max-height: calc(100svh - var(--bar-h));
            width: auto;
            height: auto;
            object-fit: contain;
        }

        /* A rotated phone is a 16:9-ish viewport — the slides' own shape.
           Reserving bar height there wastes the whole point of rotating, so
           the translucent bar overlays the slide edges instead and the slide
           takes the full height. Keyed on pointer:coarse + orientation, NOT
           a pixel height cutoff — height thresholds proved unreliable on a
           real iPhone (whose reported landscape height defied the 520/620px
           nets), while "touch device, rotated" is exactly the intent. */
        @media (pointer: coarse) and (orientation: landscape) {
            .slide {
                padding-top: 0;
            }

            .slide img {
                height: 100vh;
                height: 100svh;
                max-height: none;
                width: auto;
                max-width: 100vw;
                object-fit: contain;
            }
        }

        /* Phones get decisive snapping: momentum flicks always come to rest
           on a slide, never between two. Desktop keeps proximity so trackpad
           browsing is never fought. */
        @media (pointer: coarse) {
            html {
                scroll-snap-type: y mandatory;
            }
        }

        /* --------------------------------------------------------- closing */

        .closing {
            min-height: 55vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(1.6rem, 4vh, 2.6rem);
            padding: 4rem 1.5rem;
            text-align: center;
        }

        .closing .lockup {
            height: 2rem;
            width: auto;
            opacity: 0.9;
        }

        .closing-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.9rem;
            justify-content: center;
            align-items: center;
        }

        /* The two calls to action from the top bar, repeated as the deck's
           payoff — horizontal, echoing the bar itself. */
        .closing-stack {
            display: flex;
            flex-direction: row;
            gap: 0.9rem;
        }

        .closing-stack .btn {
            text-align: center;
        }

        /* Two lines so the button stays compact beside the berry pair. */
        .btn-twoline {
            white-space: normal;
            text-align: center;
            line-height: 1.3;
        }

        /* --------------------------------------------------- reduced motion */

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .hero-layer {
                animation: none;
                opacity: 0;   /* the lead render alone, as a still */
            }

            .chev {
                animation: none;
            }
        }
    </style>
</head>

    <script>
        /* Anchor buttons (EXPLORE, chevron): Chromium cancels smooth anchor
         * navigation when scroll-snap sits on the root — the snap pulls back
         * to the nearest point, which is still the hero, so the click appears
         * to do nothing. Workaround: lift the snap for the duration of the
         * browser's own scrollIntoView, restore it when scrolling ends. The
         * scrolling itself stays native — this is not scroll-jacking. */
        const reduced = matchMedia('(prefers-reduced-motion: reduce)');
        document.querySelectorAll('a[href^="#"]').forEach((a) => {
            a.addEventListener('click', (e) => {
                const target = document.getElementById(a.hash.slice(1));
                if (!target) return;
                e.preventDefault();
                const root = document.documentElement;
                root.style.scrollSnapType = 'none';
                const restore = () => {
                    root.style.scrollSnapType = '';
                    removeEventListener('scrollend', restore);
                };
                addEventListener('scrollend', restore);
                setTimeout(restore, 1500);   /* scrollend fallback */
                history.pushState(null, '', a.hash);
                target.scrollIntoView({ behavior: reduced.matches ? 'auto' : 'smooth' });
            });
        });

        /* Attach the four rotating hero layers AFTER window load, staggered,
         * so they can never compete with the lead image for first-paint
         * bandwidth. loading="lazy" cannot do this: it only defers images
         * below the viewport, and these are stacked inside it. */
        addEventListener('load', () => {
            const need = Math.round(innerWidth * Math.min(devicePixelRatio || 1, 2));
            document.querySelectorAll('.hero-layer').forEach((layer, i) => {
                const widths = layer.dataset.widths.split(',').map(Number);
                const w = widths.find((x) => x >= need) ?? widths[widths.length - 1];
                setTimeout(() => {
                    layer.style.backgroundImage =
                        `url(./assets/hero/${layer.dataset.slug}-${w}.webp)`;
                }, i * 400);
            });
        });
    </script>
</body>

</html>

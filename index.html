<!DOCTYPE html>
<!-- saved from url=(0032)https://electricairshipping.com/ -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Air Shipping</title>
    <link rel="shortcut icon" href="https://electricairshipping.com/assets/favicon.ico" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --pad: 1rem;
            --border: 0.25rem;
            --circlesize: 4rem;
            --bg: #111;
            --fg: #eee;
            --FULL_LENGTH: 240;
            --SEG_LENGTH: 40;
            --pink: #c628a5ff;
            --orange: #ff9900ff;
            --gray: #777;
        }

        @font-face {
            font-family: Genos;
            src: url("./assets/Genos-Regular.ttf");
        }

        html,
        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--fg);
            height: 100%;
            font-family: Genos;
            max-height: 2000px;
            /* min-height: 100dvh; */
        }

        body {
            display: grid;
            grid-template-rows: var(--pad) 1fr var(--pad) 1fr var(--pad) 10fr var(--pad);
            grid-template-columns: var(--pad) 1fr 1fr var(--pad);
            grid-template-areas:
                ".... .... .... ...."
                ".... logo cont ...."
                ".... .... .... ...."
                ".... text text ...."
                ".... .... .... ...."
                ".... main main ...."
                ".... .... .... ....";
        }

        .logo {
            grid-area: logo;
            justify-self: start;
            align-self: start;
            display: block;
        }

        .text-container-container {
            grid-area: text;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .text-container {
            /* width: 100%; */
            display: flex;
        }

        .text-spacer-left {
            width: 2rem;
            flex-shrink: 0;
        }

        .text-spacer-right {
            width: 2rem;
            flex-shrink: 0;
        }

        .text-text {
            flex-grow: 1;
            border: 0.25rem solid #222;
            border-radius: 0.25rem;
            position: relative;
            display: flex;
            justify-content: center;
        }

        .text-number {
            position: absolute;
            border: var(--border) solid #222;
            border-radius: 50%;
            width: 4rem;
            height: 4rem;
            left: calc((var(--circlesize) + var(--border))/-2);
            bottom: calc(50% - 2rem);
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .text-number>span {
            font-size: 3rem;
            color: var(--pink);
            transform: translateY(-0.2rem);
        }

        .text {
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        /* .text .title {} */

        .text .subtitle {
            font-size: 1.5rem;
        }

        .hyperlink {
            color: var(--pink);
        }

        .hyperlink:hover {
            color: var(--orange);
        }

        .contact {
            grid-area: cont;
            justify-self: end;
            align-self: start;
            font-size: 1.5rem;
            color: var(--pink);
        }

        .contact:hover {
            color: var(--orange);
        }

        /* Newsletter link shares CONTACT's grid cell and sits directly beneath it —
           no other element moves. */
        .newsletter {
            grid-area: cont;
            justify-self: end;
            align-self: start;
            margin-top: 2.2rem;
            font-size: 1.5rem;
            color: var(--pink);
            cursor: pointer;
            text-decoration: underline;
        }

        .newsletter:hover {
            color: var(--orange);
        }

        .nl-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .nl-overlay.open {
            display: flex;
        }

        .nl-box {
            background: #111;
            border: 0.25rem solid #222;
            border-radius: 0.25rem;
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: min(90vw, 26rem);
            font-size: 1.5rem;
            color: var(--pink);
        }

        .nl-box input {
            font-family: Genos;
            font-size: 1.5rem;
            background: #1c1c1c;
            color: #eaeaea;
            border: 1px solid var(--gray);
            border-radius: 0.25rem;
            padding: 0.25rem 0.75rem;
            outline: none;
        }

        .nl-box input:focus {
            border-color: var(--pink);
        }

        .nl-msg {
            font-size: 1.1rem;
            color: #eaeaea;
            min-height: 1.5rem;
        }

        .nl-actions {
            display: flex;
            gap: 1.5rem;
            justify-content: flex-end;
        }

        .nl-actions a {
            cursor: pointer;
            color: var(--pink);
        }

        .nl-actions a:hover {
            color: var(--orange);
        }

        .hex {
            grid-area: main;
            justify-self: center;
            align-self: center;
        }

        .bg-img {
            display: block;
            grid-row: 6/7;
            grid-column: 2/4;
            max-width: 100%;
            max-height: 80%;
            justify-self: center;
            align-self: center;
        }

        p,
        h1 {
            margin: 0;
        }

        @media (min-width: 800px) {
            body {
                grid-template-rows: var(--pad) 2fr var(--pad) 10fr calc(var(--pad)*2);
                grid-template-columns: var(--pad) 1fr 3fr 1fr var(--pad);
                grid-template-areas:
                    ".... .... .... .... ...."
                    ".... logo text cont ...."
                    ".... .... .... .... ...."
                    ".... main main main ...."
                    ".... .... .... .... ....";
            }

            .bg-img {
                grid-row: 3/5;
                grid-column: 2/5;
            }
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .path-animate {
            transition: stroke-dashoffset 1s ease-out;
            stroke-dasharray: var(--FULL_LENGTH);
            stroke-dashoffset: 240;
            fill: none;
            stroke: var(--pink);
            stroke-width: 0.5px;
        }

        .path-bg {
            stroke: var(--gray);
            stroke-width: 0.5px;
            fill: none;
        }

        .path0 {
            stroke-dashoffset: 240;
        }

        .path1 {
            stroke-dashoffset: 200;
        }

        .path2 {
            stroke-dashoffset: 160;
        }

        .path3 {
            stroke-dashoffset: 120;
        }

        .path4 {
            stroke-dashoffset: 80;
        }

        .path5 {
            stroke-dashoffset: 0;
        }

        .circle-select {
            transition: stroke 1s;
            transition: r 1s;
            fill: var(--bg);
            stroke: var(--gray);
            stroke-width: 0.5px;
            r: 7.5px;
        }

        .circle-select:hover {
            cursor: pointer;
        }

        .circle-select.selected {
            transition: stroke 3s;
            r: 8px;
            stroke: var(--pink);
        }

        .selected-text {
            fill: var(--pink)
        }

        svg>text {
            transition: fill 1s;
            pointer-events: none;
            fill: var(--gray);
            font-size: 10px;
            font-family: Genos;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .video-portal {
            fill: none;
            stroke: orange;
            stroke-width: 0.25px;
        }

        video {
            display: block;
            width: 50%;
            height: 50%;
            min-width: 0;
            min-height: 0;
            object-fit: contain;
        }
    </style>
</head>

<body>
    <img class="bg-img" src="./assets/bg.svg" alt="background image">
    <img class="logo" src="./assets/logo.svg">
    <div class="text-container-container">
        <div class="text-container">
            <div class="text-spacer-left"></div>
            <div class="text-text">
                <div class="text-number">
                    <span data-id="text-number">1</span>
                </div>
                <div class="text-spacer-right"></div>
                <div class="text">
                    <h1 data-id="title" class="title">Welcome to the Electric Air Shipping project!</h1>
                    <p data-id="subtitle" class="subtitle">Please explore our knowledge base.</p>
                </div>
            </div>
        </div>
    </div>
    <a class="contact" href="mailto:contact@electricairshipping.com">CONTACT</a>
    <a class="newsletter" data-nl-open>RECEIVE</a>
    <div class="nl-overlay" data-nl-overlay>
        <div class="nl-box">
            <div>Receive the EAS newsletter</div>
            <input type="email" placeholder="your@email.com" data-nl-email>
            <div data-nl-turnstile></div>
            <div class="nl-msg" data-nl-msg></div>
            <div class="nl-actions">
                <a data-nl-cancel>CANCEL</a>
                <a data-nl-ok>OK</a>
            </div>
        </div>
    </div>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <script>
        (() => {
            const overlay = document.querySelector('[data-nl-overlay]');
            const emailIn = document.querySelector('[data-nl-email]');
            const msg = document.querySelector('[data-nl-msg]');
            const okBtn = document.querySelector('[data-nl-ok]');
            let busy = false;

            // Turnstile bot check — rendered on first open (the widget dislikes
            // rendering inside display:none containers). Managed mode: invisible for
            // normal humans, shows a check only when something looks automated.
            const TURNSTILE_SITEKEY = '0x4AAAAAAEKubehZQp3K3TbK';
            let tsWidget = null;
            const renderTurnstile = () => {
                if (tsWidget !== null || !window.turnstile) return;
                tsWidget = window.turnstile.render(document.querySelector('[data-nl-turnstile]'), {
                    sitekey: TURNSTILE_SITEKEY,
                    theme: 'dark',
                });
            };

            const open = () => {
                overlay.classList.add('open');
                msg.textContent = '';
                renderTurnstile();
                emailIn.focus();
            };
            const close = () => { if (!busy) overlay.classList.remove('open'); };

            document.querySelector('[data-nl-open]').addEventListener('click', open);
            document.querySelector('[data-nl-cancel]').addEventListener('click', close);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
            emailIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') okBtn.click(); });

            okBtn.addEventListener('click', async () => {
                if (busy) return;
                const email = emailIn.value.trim();
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
                    msg.textContent = 'Please enter a valid email address.';
                    return;
                }
                const tsToken = window.turnstile && tsWidget !== null
                    ? window.turnstile.getResponse(tsWidget) : '';
                if (!tsToken) {
                    msg.textContent = 'Please complete the verification check.';
                    return;
                }
                busy = true;
                msg.textContent = 'Submitting…';
                try {
                    const res = await fetch('/api/waitlist', {
                        method: 'POST',
                        headers: { 'content-type': 'application/json' },
                        body: JSON.stringify({ email, tsToken }),
                    });
                    const data = await res.json();
                    if (data.ok) {
                        msg.textContent = data.status === 'already'
                            ? 'Already on the list ✓'
                            : 'Check your inbox to confirm ✓';
                        emailIn.value = '';
                        setTimeout(() => { busy = false; close(); }, 2600);
                        return;
                    }
                    msg.textContent = data.error === 'invalid'
                        ? 'Please enter a valid email address.'
                        : data.error === 'turnstile'
                            ? 'Verification failed — please try again.'
                            : data.error === 'email'
                                ? 'Couldn’t send the confirmation email — please try again later.'
                                : 'Something went wrong — please try again later.';
                    if (window.turnstile && tsWidget !== null) window.turnstile.reset(tsWidget);
                } catch {
                    msg.textContent = 'Something went wrong — please try again later.';
                }
                busy = false;
            });
        })();
    </script>
    <video src="assets/render.webm" autoplay="" loop="" class="hex" muted=""></video>
    <svg viewBox="0 0 100 100" class="hex">
        <path class="path-bg" d="M30 15.359 H70 L90 50 L70 84.641 H30 L10 50 Z"></path>
        <path class="path-animate" d="M30 15.359 H70 L90 50 L70 84.641 H30 L10 50 Z"></path>
        <circle class="circle-select selected" data-circle="0" cx="30" cy="15.359"></circle>
        <circle class="circle-select" data-circle="1" cx="70" cy="15.359"></circle>
        <circle class="circle-select" data-circle="2" cx="90" cy="50"></circle>
        <circle class="circle-select" data-circle="3" cx="70" cy="84.641"></circle>
        <circle class="circle-select" data-circle="4" cx="30" cy="84.641"></circle>
        <circle class="circle-select" data-circle="5" cx="10" cy="50"></circle>
        <text class="selected-text" data-text="0" x="30" y="15.359">1</text>
        <text data-text="1" x="70" y="15.359">2</text>
        <text data-text="2" x="90" y="50">3</text>
        <text data-text="3" x="70" y="84.641">4</text>
        <text data-text="4" x="30" y="84.641">5</text>
        <text data-text="5" x="10" y="50">6</text>
        <circle class="video-portal" cx="50" cy="50" r="27.5"></circle>
    </svg>
    <script>
        async function main() {
            const EXTERNAL_CONFIG_URL = "https://docs.google.com/spreadsheets/d/1rhdL3cX73liudM0vsTjT8m4eI6dCi0hKXMv6Cb41udg/gviz/tq?tqx=out:csv"
            const fetchWithTimeout = (url, ms = 2000) =>
                Promise.race([
                    fetch(url).then(async (res) => (res.ok ? csvToJson(await res.text()) : {})),
                    new Promise((resolve) => setTimeout(() => resolve({}), ms)),
                ]);

            const externalConfig = await fetchWithTimeout(EXTERNAL_CONFIG_URL).catch(() => ({}));
            const elements = {
                path: document.querySelector(".path-animate"),
                circles: document.querySelectorAll("[data-circle]"),
                texts: document.querySelectorAll("[data-text]"),
                title: document.querySelector('[data-id="title"]'),
                subtitle: document.querySelector('[data-id="subtitle"]'),
                currentNumber: document.querySelector('[data-id="text-number"]'),
            }

            const config = [{
                    title: externalConfig?.hex_title_1 ?? "Welcome to the Electric Air Shipping project!",
                    subtitle: externalConfig?.hex_subtitle_1 ?? "Please explore our knowledge base."
                },
                {
                    title: externalConfig?.hex_title_2 ?? "Click here to:-",
                    subtitle: externalConfig?.hex_subtitle_2 ??
                        "See the <a target='_blank' class='hyperlink' href='https://drive.google.com/file/d/1j3zN5wPRL4vD6RBr7XTnyx6hq1u_tfNi/view'>EAS overview (Pitchdeck)</a>"
                },
                {
                    title: externalConfig?.hex_title_3 ?? "Play with the:",
                    subtitle: externalConfig?.hex_subtitle_3 ??
                        "<a target='_blank' class='hyperlink' href='https://calc.electricairshipping.com' >Interactive EAS Fleet Calculator</a>"
                },
                {
                    title: externalConfig?.hex_title_4 ?? "Read the:",
                    subtitle: externalConfig?.hex_subtitle_4 ??
                        "<a target='_blank' class='hyperlink' href='https://drive.google.com/file/d/1ARGSUN5e6wHadcO3wT6FCcmrhRsPxvbI/view'>Vision//Whitepaper</a> (11 pages)"
                },
                {
                    title: externalConfig?.hex_title_5 ?? "Read the:",
                    subtitle: externalConfig?.hex_subtitle_5 ??
                        "<a target='_blank' class='hyperlink'  href='https://drive.google.com/file/d/1_xdBSdVZ-B19MCYf1XynxpSxqAu0TEsW/view' >Maths & Design paper</a> (11 pages)"
                },
                {
                    title: externalConfig?.hex_title_6 ?? "View the full:",
                    subtitle: externalConfig?.hex_subtitle_6 ??
                        "<a target='_blank' class='hyperlink' href='https://drive.google.com/file/d/1juDWMVLPFUiWFjtf39verL0EClEMWSwl/view'>Sunship Conceptual Design</a> (60 pages)"
                },
            ];
            function updateSelection(progressNumber) {
                elements.path.classList.remove("path0");
                elements.path.classList.remove("path1");
                elements.path.classList.remove("path2");
                elements.path.classList.remove("path3");
                elements.path.classList.remove("path4");
                elements.path.classList.remove("path5");
                elements.path.classList.add(`path${progressNumber}`);

                for (const [i, text] of elements.texts.entries()) {
                    if (i <= Number(progressNumber))
                        text.classList.add("selected-text");
                    else
                        text.classList.remove("selected-text");
                }

                for (const [i, circle] of elements.circles.entries()) {
                    if (i <= Number(progressNumber))
                        circle.classList.add("selected");
                    else
                        circle.classList.remove("selected");
                }

                elements.title.textContent = config[Number(progressNumber)].title;
                elements.subtitle.innerHTML = config[Number(progressNumber)].subtitle;
                elements.currentNumber.textContent = Number(progressNumber) + 1;
            }

            function updateText() {
                elements.title.textContent = config[0].title;
                elements.subtitle.innerHTML = config[0].subtitle;
                elements.currentNumber.textContent = 1;
            }
            updateText()


            for (const circle of elements.circles) {
                circle.addEventListener("click", () => {
                    updateSelection(circle.dataset.circle);
                });
            }
        }

        /**  @param {string} csv */
        function csvToJson(csv) {
            const csvLines = csv.split("\n");
            const data = {}
            csvLines.map((line) => {
                let templine = line;

                const firstCommaIndex = templine.indexOf(',')
                const key = templine.slice(0, firstCommaIndex).replaceAll("\"", "");
                templine = templine.slice(firstCommaIndex + 1);

                const secondCommaIndex = templine.indexOf(",")
                const type = templine.slice(0, secondCommaIndex).replaceAll("\"", "");
                templine = templine.slice(secondCommaIndex + 1);

                const value = templine;
                if (type === "number") {
                    data[key] = Number(value.replaceAll("\"", ""));
                } else {
                    data[key] = value.slice(1, value.length - 1);
                }
            })
            return data;
        }

        main()
    </script>


</body></html>
